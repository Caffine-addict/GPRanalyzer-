<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verify targets · GPR Studio</title>
<script>/* theme before first paint: the saved choice, else the device's */
try { const t = localStorage.getItem("gpr-theme"); document.documentElement.dataset.theme = t === "light" || t === "dark" ? t : (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"); } catch { document.documentElement.dataset.theme = "dark"; }</script>
<style>
  :root {
    color-scheme: dark;
    --bg: #09090b; --panel: #111113; --card: #18181b; --line: #27272a; --line-strong: #3f3f46;
    --text: #fafafa; --dim: #a1a1aa; --faint: #71717a; --accent: #3b82f6;
    --yes: #16a34a; --no: #dc2626; --unsure: #71717a; --amber: #fbbf24;
    --mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, monospace;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #fafafa; --panel: #ffffff; --card: #f4f4f5; --line: #e4e4e7; --line-strong: #d4d4d8;
    --text: #09090b; --dim: #52525b; --faint: #71717a; --accent: #2563eb; --amber: #b45309;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; }
  header a { color: var(--dim); text-decoration: none; font-size: 13px; }
  header a:hover { color: var(--text); }
  select { height: 32px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--bg); color: var(--text); font: inherit; }
  .progress { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 12.5px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .bar { width: 160px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--accent); }
  main { max-width: 1280px; margin: 0 auto; padding: 18px 20px 40px; display: grid; gap: 14px; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline; }
  .meta b { font-size: 16px; font-weight: 600; }
  .meta span { color: var(--dim); font-size: 13px; font-variant-numeric: tabular-nums; }
  .pill { font-size: 11.5px; font-weight: 500; padding: 2px 8px; border-radius: 4px; background: var(--card); color: var(--dim); }
  .pill.yes { color: #fff; background: var(--yes); } .pill.no { color: #fff; background: var(--no); } .pill.unsure { color: #fff; background: var(--unsure); }
  .channels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  figure { margin: 0; display: grid; gap: 6px; }
  figcaption { display: flex; justify-content: space-between; font-size: 12px; color: var(--dim); font-family: var(--mono); }
  figcaption .seen { color: var(--amber); }
  figure img { display: block; max-width: 100%; height: auto; image-rendering: pixelated; border-radius: 6px; border: 1px solid var(--line); background: #000; }
  .help { margin: 0; color: var(--dim); font-size: 13px; }
  .help kbd, .actions kbd { font-family: var(--mono); font-size: 11px; padding: 1px 5px; border: 1px solid var(--line-strong); border-radius: 4px; }
  .actions { display: grid; grid-template-columns: 1fr 1fr 1fr auto auto; gap: 10px; }
  button { height: 44px; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--card); color: var(--text); font: inherit; font-weight: 500; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.yes { background: var(--yes); border-color: var(--yes); color: #fff; }
  button.no { background: var(--no); border-color: var(--no); color: #fff; }
  button:disabled { opacity: .5; cursor: progress; }
  button.small { padding: 0 16px; }
  .message { margin: 0; font-size: 13px; color: var(--amber); min-height: 1.2em; }
  .done { padding: 40px 0; text-align: center; color: var(--dim); }
  @media (max-width: 820px) { .channels { grid-template-columns: 1fr; } .actions { grid-template-columns: 1fr 1fr 1fr; } .progress { margin-left: 0; } }
</style>
</head>
<body>
<header>
  <h1>Verify targets</h1>
  <a href="/">← Back to the Studio</a>
  <label>Site <select id="site" aria-label="Site"></select></label>
  <div class="progress"><span id="counts">—</span><div class="bar" aria-hidden="true"><span id="bar" style="width:0"></span></div></div>
</header>
<main id="main">
  <p class="help">Is there a real target apex where the white ticks meet, on any channel? <kbd>Y</kbd> yes ·
    <kbd>N</kbd> no (nothing there, noise or ringing) · <kbd>U</kbd> unsure · <kbd>←</kbd> <kbd>→</kbd> back and skip.
    The held-out test sites are not offered.</p>
  <div class="meta" id="meta"></div>
  <div class="channels" id="channels"></div>
  <div class="actions">
    <button class="yes" id="yes">Yes, a target <kbd>Y</kbd></button>
    <button class="no" id="no">No target <kbd>N</kbd></button>
    <button id="unsure">Unsure <kbd>U</kbd></button>
    <button class="small" id="back" aria-label="Back">←</button>
    <button class="small" id="skip" aria-label="Skip">→</button>
  </div>
  <p class="message" id="message" role="status"></p>
</main>
<script type="module" src="/static/js/verify.js"></script>
</body>
</html>
