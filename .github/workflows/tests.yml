# Every push: lint, types and the full test suite against a throwaway Postgres.
# The tag benchmark (scripts/validate_on_tags.py) needs the company's radar files, which never leave
# the dev machine; run it locally before changing detection. Tests needing that data skip themselves.
name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: gpr, POSTGRES_PASSWORD: ci-only, POSTGRES_DB: gpr_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U gpr -d gpr_test" --health-interval 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://gpr:ci-only@127.0.0.1:5432/gpr_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --all-extras --all-groups
      - run: uv run ruff check .
      - run: uv run mypy core sources parsers preprocess detect render evidence risk reason store pipeline api reports studio simulate
      - run: uv run pytest -q -p no:warnings
