[project]
name = "gpr-analyzer"
version = "0.1.0"
description = "GPR B-scan detection, evidence, risk scoring, and reasoning pipeline"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pillow>=10.0",
    "ultralytics>=8.1",
    "torch>=2.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "groq>=0.11",
    "duckdb>=1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12.0",
    "reportlab>=4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "pypdf>=4.0",
]

[tool.setuptools]
packages = [
    "core",
    "sources",
    "parsers",
    "preprocess",
    "detect",
    "render",
    "evidence",
    "risk",
    "reason",
    "store",
    "pipeline",
    "api",
    "reports",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
